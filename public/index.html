<!DOCTYPE html> 
<html lang="en"> 
<head> 
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0"> 
    <title>Cepal AI</title> 
    <link rel="icon" type="image/png" href="https://i.ibb.co/9mHVYQ7N/cepal-ai.png"> 
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script> 
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script> 
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script> 
    <script src="https://cdn.tailwindcss.com"></script> 
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"> 
    <style> 
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap'); 
        body { font-family: 'Inter', sans-serif; background-color: #212121; color: #ececf1; margin: 0; overflow-x: hidden; height: 100%; } 
        .app-shell { display: flex; height: 100vh; width: 100vw; position: relative; overflow: hidden; } 
        .sidebar { width: 260px; background: #171717; display: flex; flex-direction: column; transition: all 0.3s ease; border-right: 1px solid rgba(255,255,255,0.05); z-index: 50; position: absolute; height: 100%; left: 0; } 
        .sidebar-hidden { transform: translateX(-100%); } 
        @media (min-width: 1024px) { .sidebar { position: relative; transform: none; } .sidebar-hidden { width: 0; border: none; overflow: hidden; } }
        .chat-view { flex: 1; display: flex; flex-direction: column; background: #212121; position: relative; min-width: 0; width: 100%; height: 100%; } 
        .mobile-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 45; display: none; } 
        .sidebar-open .mobile-overlay { display: block; } 
        .send-btn { position: absolute; right: 12px; bottom: 12px; width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; transition: all 0.2s; color: #fff; background: #4d4d4d; } 
        .send-btn.active:not(:disabled) { background: #fff; color: #000; cursor: pointer; }
        .send-btn:disabled { opacity: 0.3; cursor: not-allowed; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .prose { color: #ececf1; max-width: none; font-size: 15px; line-height: 1.6; }
        .prose p { margin-bottom: 12px; }
        .input-container { background: #2f2f2f; border: 1px solid rgba(255,255,255,0.1); border-radius: 24px; padding: 8px 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
        textarea::placeholder { color: #8e8e93; font-weight: 400; }
        .msg-group:hover .delete-msg { opacity: 1; }
        .delete-msg { opacity: 0; transition: opacity 0.2s; color: #666; cursor: pointer; }
        .delete-msg:hover { color: #ef4444; }
    </style> 
</head> 
<body> 
    <div id="root"></div> 

    <script> 
        const { useState, useEffect, useRef } = React; 
        const e = React.createElement; 

        const renderMarkdown = (content) => {
            try { return marked.parse(content || ""); } 
            catch (err) { return content || ""; }
        };

        const Typewriter = ({ text }) => { 
            const [val, setVal] = useState(""); 
            const idx = useRef(0); 
            useEffect(() => { 
                const interval = setInterval(() => { 
                    if (idx.current < text.length) { 
                        const step = 15; 
                        setVal(text.slice(0, idx.current + step)); 
                        idx.current += step; 
                    } else { clearInterval(interval); } 
                }, 10); 
                return () => clearInterval(interval); 
            }, [text]); 
            return e('div', { className: "prose", dangerouslySetInnerHTML: { __html: renderMarkdown(val) } }); 
        }; 

        const App = () => { 
            const [sidebarOpen, setSidebarOpen] = useState(window.innerWidth >= 1024); 
            const [showSettings, setShowSettings] = useState(false); 
            const [input, setInput] = useState(""); 
            const [loading, setLoading] = useState(false); 
            const bottomRef = useRef(null); 

            const [history, setHistory] = useState(() => {
                const saved = localStorage.getItem('cepal_history');
                return saved ? JSON.parse(saved) : [{ id: Date.now(), title: 'New Conversation', msgs: [] }];
            });
            const [activeId, setActiveId] = useState(history[0]?.id); 

            useEffect(() => {
                localStorage.setItem('cepal_history', JSON.stringify(history));
                bottomRef.current?.scrollIntoView({ behavior: "smooth" }); 
            }, [history, loading]); 

            const activeChat = history.find(h => h.id === activeId) || history[0]; 

            const deleteMessage = (msgIdx) => {
                setHistory(prev => prev.map(h => h.id === activeId ? {
                    ...h,
                    msgs: h.msgs.filter((_, i) => i !== msgIdx)
                } : h));
            };

            const onSend = async () => { 
                if (!input.trim() || loading) return; 
                
                const userMsg = { role: 'user', content: input };
                const currentInput = input;
                setInput(""); 
                setLoading(true); 

                setHistory(prev => prev.map(h => h.id === activeId ? { 
                    ...h, 
                    title: h.msgs.length === 0 ? currentInput.slice(0, 25) : h.title, 
                    msgs: [...h.msgs, userMsg] 
                } : h)); 

                try { 
                    // 1. Clean history (Remove 'animate' and 'isRaw')
                    const cleanedMessages = activeChat.msgs.map(m => ({
                        role: m.role,
                        content: m.content
                    }));

                    // 2. Point to the Vercel API endpoint
                    const response = await fetch("/api/index.js", { 
                        method: "POST", 
                        headers: { "Content-Type": "application/json" }, 
                        body: JSON.stringify({ 
                            model: "llama-3.3-70b-versatile", 
                            messages: [
                                { role: "system", content: "You are Cepal AI, a business consultant developed by Mik Tse." },
                                ...cleanedMessages,
                                userMsg
                            ]
                        }) 
                    }); 
                    
                    const data = await response.json(); 
                    if (!response.ok) throw new Error(data.error?.message || "Connection Error");

                    const aiReply = data.choices?.[0]?.message?.content || "No response.";

                    setHistory(prev => prev.map(h => h.id === activeId ? { 
                        ...h, 
                        msgs: [...h.msgs, { role: 'assistant', content: aiReply, animate: true }] 
                    } : h)); 
                } catch (err) { 
                    setHistory(prev => prev.map(h => h.id === activeId ? { 
                        ...h, 
                        msgs: [...h.msgs, { role: 'assistant', content: `⚠️ **System Note:** ${err.message}.`, isRaw: false }] 
                    } : h)); 
                } finally { 
                    setLoading(false); 
                } 
            }; 

            return e('div', { className: `app-shell ${sidebarOpen ? 'sidebar-open' : ''}` }, 
                e('div', { className: 'mobile-overlay', onClick: () => setSidebarOpen(false) }), 
                
                e('aside', { className: `sidebar ${sidebarOpen ? "" : "sidebar-hidden"}` }, 
                    e('div', { className: 'p-3 flex flex-col h-full' }, 
                        e('button', {  
                            onClick: () => { 
                                const id = Date.now(); 
                                setHistory([{id, title:'New Chat', msgs:[]}, ...history]); 
                                setActiveId(id); 
                            }, 
                            className: 'flex items-center gap-3 w-full p-3 rounded-xl border border-white/10 hover:bg-white/5 transition mb-6 text-sm font-medium' 
                        }, e('i', { className: 'fa fa-plus' }), "New Chat"), 
                        e('div', { className: 'flex-1 overflow-y-auto no-scrollbar' }, 
                            history.map(h => e('div', { 
                                key: h.id, 
                                onClick: () => setActiveId(h.id), 
                                className: `p-3 text-sm rounded-lg cursor-pointer truncate mb-1 transition ${activeId === h.id ? 'bg-white/10 text-white' : 'text-zinc-400 hover:bg-white/5'}` 
                            }, e('i', { className: 'fa fa-message mr-3 opacity-30' }), h.title)) 
                        ), 
                        e('button', { onClick: () => setShowSettings(true), className: 'p-4 text-sm text-zinc-400 hover:text-white flex items-center gap-3 border-t border-white/5' },  
                            e('i', { className: 'fa fa-gear' }), "Settings") 
                    ) 
                ), 

                e('main', { className: 'chat-view' }, 
                    e('header', { className: 'h-14 flex items-center px-4 justify-between border-b border-white/5 bg-[#212121]' }, 
                        e('button', { onClick: () => setSidebarOpen(!sidebarOpen), className: 'p-2' }, e('i', { className: 'fa fa-bars text-xl' })), 
                        e('span', { className: 'text-sm font-medium truncate px-4 opacity-70' }, activeChat.title), 
                        e('img', { src: "https://i.ibb.co/9mHVYQ7N/cepal-ai.png", className: 'w-7 h-7' }) 
                    ), 

                    e('div', { className: 'flex-1 overflow-y-auto no-scrollbar pb-40 pt-2' }, 
                        activeChat.msgs.length === 0 ? e('div', { className: 'h-full flex flex-col items-center justify-center p-8 opacity-20' }, 
                            e('img', { src: "https://i.ibb.co/9mHVYQ7N/cepal-ai.png", className: 'w-16 h-16 mb-4' }), 
                            e('h2', { className: 'text-xl font-semibold' }, "How can I help you today?") 
                        ) : activeChat.msgs.map((m, i) => e('div', { key: i, className: `msg-group p-4 md:p-6 ${m.role === 'assistant' ? 'bg-white/[0.02]' : ''}` }, 
                            e('div', { className: 'max-w-3xl mx-auto flex gap-4 md:gap-6' }, 
                                e('div', { className: 'w-8 h-8 rounded bg-zinc-800 flex items-center justify-center flex-shrink-0' }, 
                                    e('img', { src: m.role==='user'?'https://ui-avatars.com/api/?name=U&background=444654&color=fff':'https://i.ibb.co/9mHVYQ7N/cepal-ai.png', className: 'w-6 h-6 rounded' }) 
                                ), 
                                e('div', { className: 'flex-1 text-zinc-200 relative' }, 
                                    e('div', { className: 'absolute -right-4 top-0 delete-msg', onClick: () => deleteMessage(i) }, e('i', { className: 'fa fa-trash-can text-xs' })),
                                    m.isRaw ? e('div', { dangerouslySetInnerHTML: { __html: m.content } }) : 
                                    m.animate ? e(Typewriter, { text: m.content }) : e('div', { className: "prose", dangerouslySetInnerHTML: { __html: renderMarkdown(m.content) } }) 
                                ) 
                            ) 
                        )), 
                        loading && e('div', { className: 'p-6 max-w-3xl mx-auto animate-pulse text-zinc-500 text-xs' }, "Cepal AI is thinking..."), 
                        e('div', { ref: bottomRef }) 
                    ), 

                    e('div', { className: 'absolute bottom-0 left-0 w-full p-4 bg-gradient-to-t from-[#212121] to-transparent' }, 
                        e('div', { className: 'max-w-3xl mx-auto input-container relative' }, 
                            e('textarea', { 
                                className: `w-full bg-transparent py-3 pr-12 text-[16px] outline-none focus:ring-0 transition resize-none no-scrollbar ${loading ? 'opacity-50' : ''}`, 
                                placeholder: "How can I help you today?", 
                                rows: 1, 
                                value: input, 
                                disabled: loading,
                                onChange: (v) => setInput(v.target.value), 
                                onKeyDown: (v) => v.key === 'Enter' && !v.shiftKey && (v.preventDefault(), onSend()) 
                            }), 
                            e('button', { 
                                onClick: onSend, 
                                disabled: loading || !input.trim(),
                                className: `send-btn ${input.trim() && !loading ? "active" : ""}` 
                            }, e('i', { className: 'fa fa-arrow-up text-md' })) 
                        ) 
                    ) 
                ), 

                showSettings && e('div', { className: 'fixed inset-0 bg-black/80 backdrop-blur-md flex items-center justify-center z-[100] p-4', onClick: () => setShowSettings(false) }, 
                    e('div', { className: 'bg-[#2d2d2d] rounded-2xl w-full max-w-md p-6 border border-white/10 shadow-2xl', onClick: s => s.stopPropagation() }, 
                        e('div', { className: 'flex justify-between items-center mb-6' }, 
                            e('h2', { className: 'text-xl font-bold text-white' }, "Settings"), 
                            e('button', { onClick: () => setShowSettings(false) }, e('i', { className: 'fa fa-times text-zinc-400' })) 
                        ), 
                        e('button', {  
                            onClick: () => { localStorage.clear(); window.location.reload(); }, 
                            className: 'w-full py-4 bg-red-500/10 text-red-500 rounded-xl hover:bg-red-500 hover:text-white transition text-xs font-bold uppercase tracking-widest'  
                        }, "Reset App & History") 
                    ) 
                ) 
            ); 
        }; 

        ReactDOM.createRoot(document.getElementById('root')).render(e(App)); 
    </script> 
</body> 
</html>
